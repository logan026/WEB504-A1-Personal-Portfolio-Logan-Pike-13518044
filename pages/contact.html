<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="../assets/images/kitty.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Professional Inquiries</title>
    <meta name="description" content="Contact page for professional inquires or if you need help with a technical project."
    <link rel="stylesheet" href="../assets/global-styles/reset.css">
    <link rel="stylesheet" href="../components/header/header.css">
    <link rel="stylesheet" href="../components/contact/contact.css">
    <link rel="stylesheet" href="../components/footer/footer.css">
</head>
<body>
    <header>
        <nav class="nav-container">
            <!--Hamburger Button-->
            <button class="mobile-toggle" aria-label="Open Navigation">☰</button>
            <ul class="nav-links">
                <li><a href="../pages/index.html">Home</a></li>
                <li><a href="../pages/projects.html">Projects</a></li>
                <li><a href="../pages/skills.html">Skills</a></li>
                <li><a href="../pages/contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main class="contact-container">
        <h2>Contact for Professional Inquiries</h2>
        <p>If you need someone to build and design application logic or clear technical communication, I am ready to help.</p>
        <!--Contact front end form. 'required' attribute ensures HTML validation-->
        <form class="contact-form">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <!--Type="email" ensures the browser checks for a valid @ symbol format-->
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </main>
    <footer class="site-footer">
        <div class="footer-content">
            <p>&copy; 2026 Logan Pike's Portfolio</p>
            <div class="social-links">
                <a href="https://github.com/logan026" target="_blank" rel="noopener noreferrer">GitHub</a>
            </div>
        </div>
    </footer>
    <!--Link to JavaScript form submission-->
    <script src="../components/contact/contact.js"></script>
    <script src="../components/header/header.js"></script>
</body>
</html>
