<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Proffesional Inquiries</title>
    <link rel="stylesheet" href="../components/header/header.css">
    <link rel="stylesheet" href="../components/contact/contact.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="../pages/index.html">Home</a></li>
                <li><a href="../pages/projects.html">Projects</a></li>
                <li><a href="../pages/skills.html">Skills</a></li>
                <li><a href="../pages/contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main class="contact-container">
        <h2>Contact for Proffesional Inquiries</h2>
        <p>If you need someone to build and design application logic or clear technical communication, I am ready to help.</p>
        <!--Contact front end form. 'required' attribute ensures HTML validation-->
        <form class="contact-form">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <!--Type="email" ensures the browser checks for a valid @ symbol format-->
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </main>
</body>
</html>
